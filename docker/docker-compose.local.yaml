name: muonline-web-local

services:
    app:
        build:
            context: ..
            dockerfile: docker/php/Dockerfile
            target: development
        restart: unless-stopped
        working_dir: /var/www/html
        env_file:
            - ../.env
        environment:
            APP_URL: http://${APP_DOMAIN:-localhost}
            REDIS_HOST: redis
        volumes:
            - ..:/var/www/html
            - composer-vendor:/var/www/html/vendor
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "cgi-fcgi -bind -connect 127.0.0.1:9000 >/dev/null 2>&1 || exit 1"]
            start_period: 30s
            interval: 15s
            timeout: 5s
            retries: 5
        networks:
            - application

    nginx:
        image: nginx:1.29-alpine
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ..:/var/www/html:ro
            - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/health || exit 1"]
            start_period: 10s
            interval: 15s
            timeout: 5s
            retries: 5
        networks:
            - application

    redis:
        image: redis:8-alpine
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - application

networks:
    application:
        driver: bridge

volumes:
    composer-vendor:
    redis-data:
